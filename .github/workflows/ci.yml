name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Account API smoke test (embedded DB)
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
          node scripts/smoke-accounts.mjs http://localhost:3000
